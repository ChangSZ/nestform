<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111419">
<meta name="description" content="栖构 Nestform — 在浏览器里设计户型：2D 平面编辑、拆改墙体、材料估算、3D 鸟瞰与 VR 看房。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<!-- 样式放在 head 里同步加载（而不是由 JS 引入）：否则首屏先按无样式渲染，图标会按 SVG 默认尺寸 300×150 闪一下 -->
<link rel="stylesheet" href="/src/styles.css">
<title>栖构 Nestform · 户型设计</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-lib" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3.5l13 7-5.6 1.6L10 18z"/></symbol>
    <symbol id="i-measure" viewBox="0 0 24 24"><path d="M3.5 15.5l12-12 5 5-12 12z"/><path d="M7 12l2 2M10 9l2 2M13 6l2 2"/></symbol>
    <symbol id="i-hammer" viewBox="0 0 24 24"><path d="M14 4l6 6-2.5 2.5-6-6z"/><path d="M12.5 8.5L4 17l3 3 8.5-8.5"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><circle cx="12" cy="12" r="2.2"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6-2.5-2.5 1-4.5 3.5 3 3 1M9.5 8.5L6 11"/><path d="M12.5 15l3 6"/></symbol>
    <symbol id="i-iso" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
    <symbol id="i-top" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h16M12 4v16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M4 6.5A1.5 1.5 0 015.5 5H10l2 2h6.5A1.5 1.5 0 0120 8.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 17.5z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
    <symbol id="i-wall" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 12h18M9 5v7M15 12v7"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-dock" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 14h18"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
    <symbol id="i-rotl" viewBox="0 0 24 24"><path d="M4 4v5h5"/><path d="M5.5 9A7.5 7.5 0 1 1 6 16"/></symbol>
    <symbol id="i-rotr" viewBox="0 0 24 24"><path d="M20 4v5h-5"/><path d="M18.5 9A7.5 7.5 0 1 0 18 16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  </defs>
</svg>

<div class="app">
  <!-- ================= 画布：铺满全屏，其余控件都是悬浮在上面的「浮岛」 ================= -->
  <main id="stage">
    <svg id="plan" class="tool-select" font-family="Inter,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
      <defs id="defs"></defs>
      <g id="gGrid"></g>
      <g id="gRooms"></g>
      <g id="gUnder" pointer-events="none"></g>
      <g id="gFurn"></g>
      <g id="gWalls"></g>
      <g id="gOpen"></g>
      <g id="gLabels" pointer-events="none"></g>
      <g id="gDims" pointer-events="none"></g>
      <g id="gMeasure" pointer-events="none"></g>
      <g id="gSel"></g>
    </svg>
    <div id="view3d">
      <div id="walkOverlay"><div><h3 data-en="VR tour">VR 看房</h3>
        <p id="wo1"></p>
        <p id="wo2"></p>
        <p id="wo3"></p></div></div>
      <div id="cross"></div>
      <div id="joy"><i></i></div>
      <button class="btn primary" id="walkExit" data-en="Exit VR">退出 VR</button>
      <div id="hint3d"></div>
    </div>
    <div class="compass3d only3d" id="compass3d" title="指北针" data-en-title="North"><svg viewBox="-50 -50 100 100"><circle r="46"/><g id="compassArrow"><path d="M0 -40L11 8L0 1L-11 8Z" class="n"/><path d="M0 40L9 8L0 1L-9 8Z" class="s"/><text y="-22">N</text></g></svg></div>
    <div class="loader" aria-hidden="true"><i></i><span data-en="Loading 3D engine…">正在加载 3D 引擎…</span></div>
    <div class="scalebar" id="scalebar"><span id="sbText">1 m</span><div class="bar" id="sbBar"></div></div>
    <div class="modehint" id="modehint"></div>
    <div id="fab"></div>
  </main>

  <!-- 左上：方案名 -->
  <div class="island brand-island">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="9" fill="var(--accent)"/><path d="M9 22V11l7-4 7 4v11h-5v-6h-4v6z" fill="#fff"/></svg>
    <div><b id="planTitle">三室一厅两卫 · 栖构</b><span id="subtitle">尺寸单位 mm</span></div>
  </div>

  <!-- 顶部中央：视图切换 + 当前模式的选项 -->
  <div class="island ctx-island" id="ctxIsland">
    <div class="seg" id="viewSeg" title="切换 2D / 3D (T)" data-en-title="Switch 2D / 3D (T)">
      <span class="pill"></span>
      <button class="btn" data-view="2d"><span data-en="2D">2D</span></button>
      <button class="btn" data-view="3d"><span data-en="3D">3D</span></button>
    </div>
    <span class="vsep"></span>
    <!-- 2D -->
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" title="选择 / 移动 (V)" data-en-title="Select / Move (V)"><svg><use href="#i-select"/></svg><span data-en="Select">选择</span></button>
      <button class="btn" data-tool="measure" title="测量 (M)" data-en-title="Measure (M)"><svg><use href="#i-measure"/></svg><span data-en="Measure">测量</span></button>
      <button class="btn" data-tool="wall" title="墙体：选墙编辑 / 画墙 / 开门开窗 / 拆除 (W)" data-en-title="Walls: edit / draw / doors &amp; windows / demolish (W)"><svg><use href="#i-wall"/></svg><span data-en="Walls">墙体</span></button>
    </div>
    <details class="pop only2d"><summary class="btn"><svg><use href="#i-layers"/></svg><span data-en="Layers">图层</span></summary>
      <div class="pop-card" id="layers">
        <button class="btn sw-row on" data-layer="dims"><span data-en="Dimensions">尺寸标注</span><i></i></button>
        <button class="btn sw-row on" data-layer="labels"><span data-en="Room names">房间名称</span><i></i></button>
        <button class="btn sw-row on" data-layer="furn"><span data-en="Furniture">家具</span><i></i></button>
        <button class="btn sw-row" data-layer="grid"><span data-en="Grid">网格</span><i></i></button>
        <button class="btn sw-row" data-layer="bearing"><span data-en="Highlight bearing walls">突出承重墙</span><i></i></button>
        <button class="btn sw-row on" data-layer="underlay" hidden><span data-en="Underlay image">户型图底图</span><i></i></button>
        <button class="btn sw-row on" data-layer="wallSnap" title="拖动家具时贴墙吸附" data-en-title="Snap furniture to walls while dragging"><span data-en="Wall snap">贴墙吸附</span><i></i></button>
      </div></details>
    <button class="btn accent only2d" id="importPlan" title="识别链家 / 贝壳等户型图，一键生成平面图" data-en-title="Recognize a listing floor plan image and create the plan"><svg><use href="#i-image"/></svg><span data-en="Import plan image">导入户型图</span></button>
    <!-- 3D -->
    <div class="grp only3d" id="modes3d">
      <button class="btn on" data-mode="orbit"><svg><use href="#i-orbit"/></svg><span data-en="Orbit">鸟瞰</span></button>
      <button class="btn" data-mode="walk"><svg><use href="#i-walk"/></svg><span data-en="VR">VR</span></button>
    </div>
    <div class="grp only3d">
      <button class="icon-btn" id="vIso" title="斜视" data-en-title="Isometric"><svg><use href="#i-iso"/></svg></button>
      <button class="icon-btn" id="vTop" title="俯视" data-en-title="Top view"><svg><use href="#i-top"/></svg></button>
    </div>
    <details class="pop only3d"><summary class="btn"><svg><use href="#i-cube"/></svg><span data-en="Scene">场景</span></summary>
      <div class="pop-card">
        <div class="pop-label" data-en="Walls">墙体高度</div>
        <div class="grp">
          <button class="btn chip on" data-cut="99" data-en="Full height">全高</button>
          <button class="btn chip" data-cut="1.2" data-en="Section cut">剖切</button>
        </div>
        <div id="toggles3d">
          <button class="btn sw-row on" data-t="furn"><span data-en="Furniture">家具</span><i></i></button>
          <button class="btn sw-row on" data-t="labels"><span data-en="Room labels">房间名</span><i></i></button>
          <button class="btn sw-row" data-t="night"><span data-en="Night lighting">夜景灯光</span><i></i></button>
        </div>
      </div></details>
  </div>

  <!-- 右上：历史 / 语言 / 文件 / 面板开关 -->
  <div class="island sys-island">
    <button class="icon-btn" id="undo" title="撤销 (Ctrl+Z)" data-en-title="Undo (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
    <button class="icon-btn" id="redo" title="重做 (Ctrl+Shift+Z)" data-en-title="Redo (Ctrl+Shift+Z)"><svg><use href="#i-redo"/></svg></button>
    <span class="vsep"></span>
    <details class="pop"><summary class="btn mono" id="langBtn">简</summary>
      <div class="pop-card narrow" id="langSel" role="group" aria-label="Language / 语言">
        <button class="btn chip" data-lang="zh">简体中文</button>
        <button class="btn chip" data-lang="zht">繁體中文</button>
        <button class="btn chip" data-lang="en">English</button>
      </div></details>
    <button class="icon-btn" id="fullscreen" title="全屏 (Shift+F)"><svg><use href="#i-expand"/></svg><span hidden>全屏</span></button>
    <details class="menu pop"><summary class="btn"><svg><use href="#i-file"/></svg><span data-en="File">文件</span></summary>
      <div class="menu-pop pop-card">
        <button class="btn" id="importPlan2" data-en="Import floor plan image…">导入户型图…</button>
        <hr>
        <button class="btn" id="exportPng" data-en="Export image (2D plan / 3D view)">导出图片（2D 平面 / 3D 效果图）</button>
        <button class="btn" id="exportVR" data-en="Export VR tour (HTML)">导出 VR 看房（HTML）</button>
        <button class="btn" id="exportJson" data-en="Export plan JSON">导出方案 JSON</button>
        <button class="btn" id="importJson" data-en="Import plan">导入方案</button>
        <hr>
        <button class="btn danger" id="clearAll" data-en="Clear all furniture">清空全部家具</button>
        <button class="btn danger" id="reset" data-en="Reset to default">重置为默认方案</button>
      </div></details>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <span class="vsep"></span>
    <button class="icon-btn chip" id="tgLib" aria-label="Library"><svg><use href="#i-lib"/></svg></button>
    <button class="icon-btn chip" id="tgPanel" aria-label="Inspector"><svg><use href="#i-panel"/></svg></button>
  </div>

  <!-- 右下：缩放（2D） -->
  <div class="zoom only2d">
    <button class="icon-btn" id="zoomIn" title="放大" data-en-title="Zoom in"><svg><use href="#i-plus"/></svg></button>
    <button class="btn mono" id="ratio" title="当前比例" data-en-title="Current scale">—</button>
    <button class="icon-btn" id="zoomOut" title="缩小" data-en-title="Zoom out"><svg><use href="#i-minus"/></svg></button>
    <span class="hsep"></span>
    <button class="icon-btn" id="fit" title="适应窗口 (F)" data-en-title="Fit to window (F)"><svg><use href="#i-fit"/></svg></button>
    <button class="btn mono xs" id="s60" title="按 1:60 显示（与原图同比例）" data-en-title="Show at 1:60">60</button>
    <button class="btn mono xs" id="s100" title="按 1:100 显示" data-en-title="Show at 1:100">100</button>
  </div>

  <!-- 左侧：素材面板（地面 / 墙面 / 家具家电）；3D 模式下顶部多一组房间导航 -->
  <aside class="lib libpanel">
    <div class="lib-head">
      <label class="search"><svg><use href="#i-search"/></svg><input id="libSearch" type="search" placeholder="搜索地面、墙面、家具…" data-en-ph="Search floors, walls, furniture…" autocomplete="off"></label>
      <div class="lib-cats" id="libCats"></div>
    </div>
    <div id="lib"></div>
  </aside>

  <!-- 右侧：检查器 -->
  <aside class="right inspector"><div id="panel"></div></aside>

  <footer class="status">
    <span class="only2d">X <b id="cx">—</b></span><span class="only2d">Y <b id="cy">—</b></span>
    <span id="hover" class="only2d"></span>
    <span class="spacer"></span>
    <span id="tip"></span>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/entry.js"></script>
</body>
</html>
